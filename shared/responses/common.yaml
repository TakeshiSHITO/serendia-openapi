components:
  responses:
    # 200 - 一般的な成功レスポンス
    OK:
      description: Success
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Success
    # 201 - リソースの作成が完了
    Created:
      description: 作成完了しました
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 作成完了しました
    # 202 - リクエストが受理された（非同期処理など）
    Accepted:
      description: 受理されました
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 受理されました
    # 200 - リソースの更新が完了
    Updated:
      description: 更新完了しました
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 更新完了しました
    # 204 - 成功したがレスポンスボディがない
    NoContent:
      description: 成功しました
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 内容なし
    # 401 - 認証が必要
    Unauthorized:
      description: 認証が必要です
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 認証が必要です
    # 200 - ログアウト成功
    LogoutOK:
      description: Logged out successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: ログアウトに成功しました
    # 404 - リソースが見つからない
    NotFound:
      description: リソースが見つかりません
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: リソースが見つかりません
    # 409 - リソースが既に存在する（重複エラー）
    Conflict:
      description: リソースが既に存在します
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: リソースが既に存在します
    # 422 - 入力データのバリデーションエラー
    UnprocessableEntity:
      description: 入力データが不正です
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: 入力データが不正です
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                    message:
                      type: string
    # 500 - サーバー内部エラー
    InternalServerError:
      description: サーバーエラーが発生しました
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: サーバーエラーが発生しました
    # 502 - ゲートウェイエラー
    BadGateway:
      description: ゲートウェイエラーが発生しました
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: ゲートウェイエラーが発生しました
    # 503 - サービスが一時的に利用できない
    ServiceUnavailable:
      description: サービスが一時的に利用できません
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: サービスが一時的に利用できません

