#自分のプロフィール取得/更新（身体寸法・嗜好タグなど）。
/me/root:
  get:
    operationId: getMyProfile
    tags: [Profile]
    security: [{ bearerAuth: [] }]
    summary: 自分のプロフィールを取得
    description: ログイン中のユーザーのプロフィール情報を取得します。身体測定値や設定などの個人情報が含まれます。
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema: { $ref: ../schemas/profile.yaml#/components/schemas/Profile }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }

  patch:
    operationId: updateMyProfile
    tags: [Profile]
    security: [{ bearerAuth: [] }]
    summary: プロフィールを更新
    description: ログイン中のユーザーのプロフィール情報を更新します。身体測定値や好みの設定などを変更できます。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/profile.yaml#/components/schemas/ProfileUpdate }
    responses:
      '200': { description: Updated }
      '422': { $ref: ../../../shared/responses/common.yaml#/components/responses/UnprocessableEntity }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }