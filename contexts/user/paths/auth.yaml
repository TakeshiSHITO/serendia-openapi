/auth/signup:
  post:
    tags: [Auth]
    summary: メールアドレスとパスワードで新規登録
    description: 新規ユーザーアカウントを作成します。メールアドレスとパスワードを受け取り、アクセストークンとリフレッシュトークンを返します。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/auth.yaml#/components/schemas/SignupRequest }
    responses:
      '201':
        description: Account created
        content:
          application/json:
            schema: { $ref: ../schemas/auth.yaml#/components/schemas/TokensWithRole }
      '409': { $ref: ../../shared/responses/common.yaml#/components/responses/Conflict }

/auth/login:
  post:
    tags: [Auth]
    summary: メールアドレスとパスワードでログイン
    description: 既存のユーザーアカウントでログインします。認証情報を受け取り、アクセストークンとリフレッシュトークンを返します。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/auth.yaml#/components/schemas/LoginRequest }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema: { $ref: ../schemas/auth.yaml#/components/schemas/TokensWithRole }
      '401': { $ref: ../../shared/responses/common.yaml#/components/responses/Unauthorized }

/auth/refresh:
  post:
    tags: [Auth]
    summary: アクセストークンを更新
    description: リフレッシュトークンを使用して新しいアクセストークンを発行します。アクセストークンの有効期限が切れた際に使用します。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/auth.yaml#/components/schemas/RefreshRequest }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema: { $ref: ../schemas/auth.yaml#/components/schemas/Tokens }
      '401': { $ref: ../../shared/responses/common.yaml#/components/responses/Unauthorized }

/auth/logout:
  post:
    tags: [Auth]
    security: [{ bearerAuth: [] }]
    summary: ログアウトしてリフレッシュトークンを無効化
    description: ユーザーをログアウトし、指定されたリフレッシュトークンを無効化します。これにより、そのトークンを使用した新しいアクセストークンの発行ができなくなります。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              refreshToken: { type: string }
    responses:
      '204': { $ref: ../../shared/responses/common.yaml#/components/responses/NoContent }