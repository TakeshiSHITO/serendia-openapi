# ユーザー認証の最小セット（サインアップ/ログイン/トークン更新/ログアウト）。
/auth/signup:
  post:
    operationId: signup
    tags: [Auth]
    security: []
    summary: メールアドレスとパスワードで新規登録
    description: 新規ユーザーアカウントを作成します。メールアドレスとパスワードを受け取り、アクセストークンとリフレッシュトークンを返します。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/auth.yaml#/components/schemas/SignupRequest }
    responses:
      '201':
        description: Account created
        content:
          application/json:
            schema: { $ref: ../schemas/auth.yaml#/components/schemas/TokensWithRole }
      '409': { $ref: ../../../shared/responses/common.yaml#/components/responses/Conflict }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }

/auth/login:
  post:
    operationId: login
    tags: [Auth]
    security: []
    summary: メールアドレスとパスワードでログイン
    description: 既存のユーザーアカウントでログインします。認証情報を受け取り、アクセストークンとリフレッシュトークンを返します。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/auth.yaml#/components/schemas/LoginRequest }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema: { $ref: ../schemas/auth.yaml#/components/schemas/TokensWithRole }
      '401': { $ref: ../../../shared/responses/common.yaml#/components/responses/Unauthorized }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }

/auth/refresh:
  post:
    operationId: refreshToken
    tags: [Auth]
    security: []
    summary: アクセストークンを更新
    description: リフレッシュトークンを使用して新しいアクセストークンを発行します。アクセストークンの有効期限が切れた際に使用します。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/auth.yaml#/components/schemas/RefreshRequest }
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema: { $ref: ../schemas/auth.yaml#/components/schemas/Tokens }
      '401': { $ref: ../../../shared/responses/common.yaml#/components/responses/Unauthorized }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }

/auth/logout:
  post:
    operationId: logout
    tags: [Auth]
    security: [{ bearerAuth: [] }]
    summary: ログアウト
    description: ユーザーをログアウトし、指定されたリフレッシュトークンを無効化します。これにより、そのトークンを使用した新しいアクセストークンの発行ができなくなります。
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              refreshToken: { type: string }
    responses:
      '200': { $ref: ../../../shared/responses/common.yaml#/components/responses/OK }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }