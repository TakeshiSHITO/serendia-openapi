# 共有用の短縮リンク発行と解決(302)。可視性(unlisted/public)や期限の指定に対応。
/shares:
  post:
    operationId: createShareLink
    tags: [Sharing]
    security: [{ bearerAuth: [] }]
    summary: 共有可能なリンクを作成
    description: LookやコレクションなどのコンテンツをSNSやメッセージで共有するための短縮リンクを生成します。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/sharing.yaml#/components/schemas/ShareCreateRequest }
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema: { $ref: ../schemas/sharing.yaml#/components/schemas/Share }
      '422': { $ref: ../../../shared/responses/common.yaml#/components/responses/UnprocessableEntity }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }

/s/{shortCode}:
  get:
    operationId: resolveShareLink
    tags: [Sharing]
    security: []
    summary: 共有リンクを解決してリダイレクト
    description: 短縮コードから元のコンテンツURLを解決し、クリックを記録した上でアプリまたはWebページへリダイレクトします。
    parameters:
      - in: path
        name: shortCode
        required: true
        schema: { type: string }
    responses:
      '200':
        description: Success - resolved share link information
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
      '302':
        description: Redirects to deep link or web landing
        headers:
          Location:
            description: Target URL
            schema: { type: string, format: uri }
      '404': { $ref: ../../../shared/responses/common.yaml#/components/responses/NotFound }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }
