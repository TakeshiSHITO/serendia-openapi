/sign/url:
  post:
    tags: [SelfAssets]
    security: [{ bearerAuth: [] }]
    summary: 直接アップロード用の署名付きURLを発行
    description: ユーザーの写真などのアセットをクラウドストレージに直接アップロードするための署名付きURLを発行します。
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema: { $ref: ../schemas/self_assets.yaml#/components/schemas/SignUrlResponse }

/assets/root:
  post:
    tags: [SelfAssets]
    security: [{ bearerAuth: [] }]
    summary: アップロードしたアセットを同意付きで登録
    description: 署名付きURLでアップロードしたアセットをシステムに登録します。利用規約への同意情報も含めて保存されます。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/self_assets.yaml#/components/schemas/RegisterAssetRequest }
    responses:
      '201':
        description: Created
        content:
          application/json:
            schema: { $ref: ../schemas/self_assets.yaml#/components/schemas/SelfAsset }
  get:
    tags: [SelfAssets]
    security: [{ bearerAuth: [] }]
    summary: 自分のアセット一覧を取得
    description: ログイン中のユーザーが登録したすべてのアセット（写真など）の一覧を取得します。
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items: { $ref: ../schemas/self_assets.yaml#/components/schemas/SelfAsset }
/asset/item:
  delete:
    tags: [SelfAssets]
    security: [{ bearerAuth: [] }]
    summary: アセットを削除
    description: 指定したIDのアセットをシステムから削除します。削除されたアセットは復元できません。
    parameters:
      - in: path
        name: assetId
        required: true
        schema: { type: string, format: uuid }
    responses:
      '204': { $ref: ../../shared/responses/common.yaml#/components/responses/NoContent }