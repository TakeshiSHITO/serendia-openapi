# 管理者によるカタログ管理。
/api/catalog/garments:
  post:
    operationId: demoAdminCreateGarment
    tags: [DemoCatalogControl]
    security: [{ bearerAuth: [] }]
    summary: Garment を登録
    description: >
      管理者が任意のブランド ID を指定して新しいガーメントを登録します。
      ショップロールと異なりブランドの制限はありません。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/catalog.yaml#/components/schemas/GarmentCreateRequest }
    responses:
      '201':
        description: Garment created
        content:
          application/json:
            schema: { $ref: ../schemas/catalog.yaml#/components/schemas/Garment }
      '401': { $ref: ../../../shared/responses/common.yaml#/components/responses/Unauthorized }
      '422': { $ref: ../../../shared/responses/common.yaml#/components/responses/UnprocessableEntity }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }

/api/catalog/garments/{garmentId}/variants:
  post:
    operationId: demoAdminCreateVariant
    tags: [DemoCatalogControl]
    security: [{ bearerAuth: [] }]
    summary: Garment に Variant を追加
    description: >
      任意のブランドに属するガーメントに SKU/バリアントを登録します。
    parameters:
      - name: garmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: ガーメント ID
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/catalog.yaml#/components/schemas/VariantCreateRequest }
    responses:
      '201':
        description: Variant created
        content:
          application/json:
            schema: { $ref: ../schemas/catalog.yaml#/components/schemas/Variant }
      '401': { $ref: ../../../shared/responses/common.yaml#/components/responses/Unauthorized }
      '404': { $ref: ../../../shared/responses/common.yaml#/components/responses/NotFound }
      '422': { $ref: ../../../shared/responses/common.yaml#/components/responses/UnprocessableEntity }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }

/api/catalog/variants/{variantId}/media:
  post:
    operationId: demoAdminAddVariantMedia
    tags: [DemoCatalogControl]
    security: [{ bearerAuth: [] }]
    summary: Variant のメディア追加
    description: >
      全ブランドのバリアントに対して公式画像/動画を紐づけます。
    parameters:
      - name: variantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: バリアント ID
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/catalog.yaml#/components/schemas/VariantMediaRequest }
    responses:
      '201':
        description: Media registered
        content:
          application/json:
            schema: { $ref: ../schemas/catalog.yaml#/components/schemas/VariantMedia }
      '401': { $ref: ../../../shared/responses/common.yaml#/components/responses/Unauthorized }
      '404': { $ref: ../../../shared/responses/common.yaml#/components/responses/NotFound }
      '422': { $ref: ../../../shared/responses/common.yaml#/components/responses/UnprocessableEntity }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }

/api/catalog/variants/{variantId}/publish:
  post:
    operationId: demoAdminPublishVariant
    tags: [DemoCatalogControl]
    security: [{ bearerAuth: [] }]
    summary: Variant を公開または再公開
    description: >
      管理者から手動で PUBLISHED 状態に遷移させたり、将来的には強制 unpublish 用パラメータを拡張予定です。
    parameters:
      - name: variantId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: バリアント ID
    requestBody:
      required: false
      content:
        application/json:
          schema: { $ref: ../schemas/catalog.yaml#/components/schemas/VariantPublishRequest }
    responses:
      '200':
        description: Variant published
        content:
          application/json:
            schema: { $ref: ../schemas/catalog.yaml#/components/schemas/Variant }
      '401': { $ref: ../../../shared/responses/common.yaml#/components/responses/Unauthorized }
      '404': { $ref: ../../../shared/responses/common.yaml#/components/responses/NotFound }
      '409': { $ref: ../../../shared/responses/common.yaml#/components/responses/Conflict }
      '422': { $ref: ../../../shared/responses/common.yaml#/components/responses/UnprocessableEntity }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }
