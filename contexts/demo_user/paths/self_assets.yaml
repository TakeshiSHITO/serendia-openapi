# セルフィーアセットの登録と利用許可。
/api/self-assets:
  post:
    operationId: demoCreateSelfAsset
    tags: [DemoSelfAssets]
    security: [{ bearerAuth: [] }]
    summary: セルフィー保存（SelfAssetVault BC）
    description: >
      セルフィーをアップロードするためのスロットを確保し、アップロード URL などの
      情報を返します。
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/self_assets.yaml#/components/schemas/SelfAssetCreateRequest }
    responses:
      '201':
        description: セルフィーアップロード枠を確保しました
        content:
          application/json:
            schema: { $ref: ../schemas/self_assets.yaml#/components/schemas/SelfAsset }
      '401': { $ref: ../../../shared/responses/common.yaml#/components/responses/Unauthorized }
      '422': { $ref: ../../../shared/responses/common.yaml#/components/responses/UnprocessableEntity }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }

/api/self-assets/{selfAssetId}/grants:
  post:
    operationId: demoCreateSelfAssetGrant
    tags: [DemoSelfAssets]
    security: [{ bearerAuth: [] }]
    summary: セルフィーアクセス権限を付与
    description: >
      SelfAssetVault BC に登録されたセルフィーを、TryOn パイプラインなどのコンシューマへ
      共有するための利用許可を発行します。
    parameters:
      - name: selfAssetId
        in: path
        required: true
        schema: { type: string, format: uuid }
        description: 対象セルフィーアセット ID
    requestBody:
      required: true
      content:
        application/json:
          schema: { $ref: ../schemas/self_assets.yaml#/components/schemas/SelfAssetGrantRequest }
    responses:
      '201':
        description: 利用許可を発行しました
        content:
          application/json:
            schema: { $ref: ../schemas/self_assets.yaml#/components/schemas/SelfAssetGrant }
      '401': { $ref: ../../../shared/responses/common.yaml#/components/responses/Unauthorized }
      '404': { $ref: ../../../shared/responses/common.yaml#/components/responses/NotFound }
      '422': { $ref: ../../../shared/responses/common.yaml#/components/responses/UnprocessableEntity }
      '500': { $ref: ../../../shared/responses/common.yaml#/components/responses/InternalServerError }
